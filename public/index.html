<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy login Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Functional additions only – no design changes ── */
        .error-msg {
            display: none;
            background: #fdf0ef;
            border: 1px solid #f5c6c2;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        /* .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        } */

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button[disabled] {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="Login">
        <h1>🌿PharmaTrack</h1>

        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>

        <!-- Error message box (hidden by default) -->
        <div class="error-msg" id="errorMsg"></div>

        <div>
            <select id="role" name="role" required>
                <option value="admin">ADMIN</option>
                <option value="staff">STAFF</option>
            </select>
            <br><br>
            <input type="email" id="email" name="email" placeholder="me@gmail.com" required autocomplete="email">
            <br><br>
            <input type="password" id="pass" name="pass" placeholder="Enter Your Password" required autocomplete="current-password">
            <br><br>

            <button type="button" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">Login</span>
                <div class="spinner" id="spinner"></div>
            </button>

            <p class="flex">PharmaTrack &nbsp;•&nbsp; Qwerry Crafters &nbsp;•&nbsp; v1.0</p>
        </div>
    </div>

    <script>
        // Allow Enter key to submit
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value;
            const role     = document.getElementById('role').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn      = document.getElementById('loginBtn');
            const btnText  = document.getElementById('btnText');
            const spinner  = document.getElementById('spinner');

            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields.');
                return;
            }

            // Loading state
            btn.disabled          = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });

                const data = await res.json();

                if (data.success) {
                    const name = data.user.Name || data.user.name || email;
                    window.location.href = `/dashboard.html?role=${encodeURIComponent(data.role)}&username=${encodeURIComponent(name)}`;
                } else {
                    showError(data.message || 'Invalid credentials. Please try again.');
                }
            } catch (err) {
                showError('Network error. Please check your server.');
            } finally {
                btn.disabled          = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent   = msg;
            el.style.display = 'block';
        }
    </script>

</body>
</html>
